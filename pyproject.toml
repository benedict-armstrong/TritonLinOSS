[project]
name = "damped-linoss"
version = "0.1.0"
description = "Damped Linear Oscillatory State Space Models in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.9.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
    "sktime>=0.30.0",
]

[project.optional-dependencies]
cuda = ["triton>=3.0.0"]
jax = [
    "equinox>=0.13.0",
    "jax[cuda12]>=0.6.2",
    "optax>=0.2.5",
]
dev = [
    "pytest>=8.0.0",
    "damped-linoss[cuda,jax]",
]
export = [
    "onnx>=1.20.0",
    "onnxscript>=0.5.7",
    "onnxruntime>=1.23.2",
    "onnxruntime-extensions>=0.14.0",
    "transformers>=4.57.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["damped_linoss*"]
